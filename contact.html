<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Tasty Recipes with your questions, feedback, or recipe suggestions.">
    <title>Tasty Recipes | Contact</title>
</head>

<body>

    <header>
        <h1>Tasty Recipes</h1>
        <p>Simple recipes. Delicious results.</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="recipes.html">Recipes</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Contact Us</h2>

            <p>
                Have a question, suggestion, or recipe idea?
                Send us a message using the form below.
            </p>

            <form action="#" method="post">

                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="subject">Subject:</label><br>
                    <input type="text" id="subject" name="subject" required>
                </p>

                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </p>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Tasty Recipes. All rights reserved.</p>
    </footer>

</body>

</html>
